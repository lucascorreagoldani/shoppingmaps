name: ShoppingMaps
options:
  bundleIdPrefix: com.lucas.shoppingmaps
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  ShoppingMaps:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShoppingMapsApp
    info:
      path: ShoppingMapsApp/Info.plist
      properties:
        CFBundleDisplayName: "ShoppingMaps"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "O ShoppingMaps precisa do acesso à sua localização para identificar sua presença no shopping e calcular rotas indoor até lojas e serviços."
        LSApplicationQueriesSchemes:
          - waze
          - comgooglemaps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucas.shoppingmaps.ShoppingMapsApp
        DEVELOPMENT_TEAM: "J747JQ5H3S"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
